<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkeon — Demo interactiva</title>
<style>
  :root{
    --bg:#0B0F17; --card:#161329; --violet:#8B5CF6; --indigo:#5B6EF5; --cyan:#2DD4BF;
    --text:#F2F0FA; --muted:#9C97C4; --border:#2A2450;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at 20% 10%, #1C1638 0%, var(--bg) 55%);
    color:var(--text);min-height:100vh;padding:24px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .brand svg{width:32px;height:32px;}
  .brand span{font-weight:800;font-size:17px;background:linear-gradient(90deg,var(--violet),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;}

  .control{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px 22px;margin-bottom:16px;}
  .control-label{font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:700;margin-bottom:12px;}
  .control-row{display:flex;gap:12px;flex-wrap:wrap;}
  .field{flex:1;min-width:200px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .field input,.field select{width:100%;background:#0F0C20;border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:10px;font-size:14px;font-family:inherit;}
  .field input:focus,.field select:focus{outline:2px solid var(--indigo);}

  .role-banner{
    max-width:420px;margin:0 auto 14px;padding:10px 16px;border-radius:12px;
    background:linear-gradient(90deg,rgba(139,92,246,.18),rgba(45,212,191,.18));
    border:1px solid var(--border);font-size:13px;color:var(--text);text-align:center;
  }

  .phone{max-width:420px;margin:0 auto;background:#0C1118;border-radius:28px;border:1px solid var(--border);overflow:hidden;box-shadow:0 30px 80px -20px rgba(139,92,246,.25);}
  .chat-header{background:linear-gradient(135deg,var(--violet),var(--indigo));padding:16px 18px;display:flex;align-items:center;gap:12px;}
  .avatar{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0;}
  .chat-header .name{font-weight:700;font-size:15px;color:#fff;}
  .chat-header .status{font-size:12px;color:rgba(255,255,255,.75);}

  .chat-body{background:#0F1420;height:420px;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:10px;}
  .bubble{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.4;white-space:pre-wrap;}
  .bubble.lead{align-self:flex-start;background:#1E2333;color:var(--text);border-bottom-left-radius:4px;}
  .bubble.bot{align-self:flex-end;background:linear-gradient(135deg,var(--indigo),var(--cyan));color:#0B0F17;font-weight:500;border-bottom-right-radius:4px;}
  .crm-card{
    align-self:flex-end;max-width:88%;background:#0C1118;border:1.5px solid var(--cyan);border-radius:14px;padding:12px 14px;font-size:13px;
  }
  .crm-card .title{color:var(--cyan);font-weight:800;font-size:11px;letter-spacing:1px;margin-bottom:8px;}
  .crm-card .row{display:flex;justify-content:space-between;gap:12px;padding:3px 0;color:var(--text);}
  .crm-card .row span:first-child{color:var(--muted);flex-shrink:0;}
  .crm-card .row span:last-child{text-align:right;}

  .typing{align-self:flex-end;display:flex;gap:4px;padding:12px 16px;background:linear-gradient(135deg,var(--indigo),var(--cyan));border-radius:16px;border-bottom-right-radius:4px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:#0B0F17;opacity:.5;animation:bounce 1s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-4px);}}

  .chat-input{background:#161B29;padding:12px 14px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--border);}
  .chat-input input{flex:1;background:#0C1118;border:1px solid var(--border);border-radius:20px;padding:10px 16px;color:var(--text);font-size:14px;font-family:inherit;}
  .chat-input input:focus{outline:2px solid var(--indigo);}
  .chat-input button{width:38px;height:38px;border-radius:50%;background:var(--cyan);border:none;display:flex;align-items:center;justify-content:center;color:#0B0F17;font-weight:700;font-size:15px;cursor:pointer;flex-shrink:0;}
  .chat-input button:disabled{opacity:.4;cursor:not-allowed;}

  .chips{max-width:420px;margin:12px auto 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .chips button{background:rgba(139,92,246,.12);border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:16px;font-size:12.5px;cursor:pointer;font-family:inherit;}
  .chips button:hover{border-color:var(--indigo);color:var(--text);}

  .reset{display:block;margin:16px auto 0;background:transparent;border:1px solid var(--border);color:var(--muted);padding:8px 18px;border-radius:20px;font-size:13px;cursor:pointer;font-family:inherit;}
  .reset:hover{border-color:var(--indigo);color:var(--text);}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 130 158" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="g" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#8B5CF6"/><stop offset="55%" stop-color="#5B6EF5"/><stop offset="100%" stop-color="#2DD4BF"/>
      </linearGradient></defs>
      <path d="M 20 150 L 20 65 A 45 45 0 0 1 110 65 L 110 150" stroke="url(#g)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="51" y="94" width="28" height="50" rx="14" fill="#2DD4BF"/>
    </svg>
    <span>Arkeon · Demo interactiva</span>
  </div>

  <div class="control">
    <div class="control-label">PANEL DE CONTROL — no se comparte en pantalla</div>
    <div class="control-row">
      <div class="field">
        <label for="empresa">Nombre de la empresa del lead</label>
        <input id="empresa" type="text" value="tu negocio" placeholder="ej: Ciclos Martínez">
      </div>
      <div class="field">
        <label for="modo">Demo</label>
        <select id="modo">
          <option value="bi">Business Intelligence — tú eres el dueño</option>
          <option value="asesor">Agente asesor de producto — tú eres el cliente</option>
          <option value="leads">Agente de cualificación + CRM — tú eres el cliente</option>
        </select>
      </div>
    </div>
  </div>

  <div class="role-banner" id="roleBanner"></div>

  <div class="phone">
    <div class="chat-header">
      <div class="avatar" id="avatarLetter">A</div>
      <div><div class="name" id="headerName">tu negocio</div><div class="status">en línea · Asistente IA</div></div>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input">
      <input id="userInput" type="text" placeholder="Escribe un mensaje…" autocomplete="off">
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <div class="chips" id="chips"></div>
  <button class="reset" onclick="resetChat()">↻ Reiniciar conversación</button>
</div>

<script>
/* ───────────────────────────────────────────────────────────────
   Demo autónoma: un solo archivo, sin backend y sin claves.
   Las respuestas están guionizadas aquí abajo — se disparan por
   palabras clave (modo BI) o siguen un flujo de preguntas (modos
   asesor y leads). Para cambiar lo que dice el asistente, edita
   los textos de SCRIPTS; no hace falta tocar nada más.
   ─────────────────────────────────────────────────────────────── */

const empresaInput = document.getElementById('empresa');
const modoSelect   = document.getElementById('modo');
const chatBody     = document.getElementById('chatBody');
const headerName   = document.getElementById('headerName');
const avatarLetter = document.getElementById('avatarLetter');
const userInput    = document.getElementById('userInput');
const sendBtn      = document.getElementById('sendBtn');
const roleBanner   = document.getElementById('roleBanner');
const chipsBox     = document.getElementById('chips');

let step = 0;      // posición dentro del flujo (modos asesor y leads)
let answers = [];  // respuestas del lead, para rellenar la ficha de CRM

const has = (text, ...words) => words.some(w => text.includes(w));

const SCRIPTS = {

  /* ── 1. Business Intelligence ───────────────────────────────── */
  bi: {
    role: "🎭 Tú eres: el dueño de {{empresa}}. Pregúntale a tu asistente cómo va el negocio.",
    greeting: "¡Hola! Soy tu asistente de datos de {{empresa}}. Pregúntame lo que quieras sobre cómo va el negocio 📊",
    chips: ["¿Cómo va el mes?", "¿Algún cliente en riesgo?", "¿Y los gastos?", "¿Qué es lo más rentable?"],
    reply(text) {
      const t = text.toLowerCase();

      if (has(t, 'factur', 'ventas', 'ingres', 'mes', 'cómo va', 'como va', 'qué tal', 'que tal'))
        return "Vas bien 📈 Llevas 12.400€ facturados este mes, un 8% por encima del anterior. El margen operativo está en el 34%, estable.";

      if (has(t, 'margen', 'rentab', 'benefic', 'ganan'))
        return "Margen operativo del 34% este mes. Tu servicio de mayor volumen es también el más rentable: 48% de margen. Ahí es donde más te compensa empujar.";

      if (has(t, 'client', 'riesgo', 'inactiv', 'perd', 'fug', 'churn'))
        return "Tienes 3 clientes sin actividad en más de 30 días — son el 15% de tu facturación recurrente:\n\n• Cliente A — 340€/mes, 34 días\n• Cliente B — 210€/mes, 31 días\n• Cliente C — 180€/mes, 45 días\n\nYo empezaría por el A y el C. ¿Te preparo un mensaje para cada uno?";

      if (has(t, 'gast', 'coste', 'proveed', 'compra'))
        return "Ojo aquí ⚠️ El gasto en proveedores ha subido un 12% este trimestre. Es lo único que va en dirección contraria al resto del negocio.";

      if (has(t, 'rentable', 'mejor', 'producto', 'servicio', 'top'))
        return "Tu servicio de mayor volumen, con un 48% de margen. Curiosamente es también el que menos promocionas.";

      if (has(t, 'mensaje', 'escrib', 'contact', 'sí', 'si', 'vale', 'ok', 'dale', 'adelante'))
        return "Hecho ✅ Te he dejado 3 borradores listos, uno por cliente, con el asunto y el histórico de cada uno. Los tienes en tu bandeja para revisar y enviar.";

      if (has(t, 'previs', 'futuro', 'próximo', 'proximo', 'cerrar'))
        return "Si el ritmo se mantiene, cierras el mes en torno a 13.100€. Recuperar a los 3 clientes inactivos te pondría cerca de 13.800€.";

      return "Puedo mirarlo. De momento lo que más destaca: facturación +8%, margen al 34%, y 3 clientes inactivos que valen el 15% de tus ingresos recurrentes. ¿Por dónde quieres empezar?";
    }
  },

  /* ── 2. Agente asesor de producto ───────────────────────────── */
  asesor: {
    role: "🎭 Tú eres: un cliente interesado. Escríbele como si quisieras comprar.",
    greeting: "¡Hola! Bienvenido a {{empresa}} 🚲 ¿En qué puedo ayudarte hoy?",
    chips: ["Busco una bici", "Para ir al trabajo", "Unos 800€", "Soy principiante"],
    reply(text, step) {
      const t = text.toLowerCase();

      if (step === 0)
        return "¡Genial! Para acertar con la recomendación: ¿para qué la vas a usar principalmente — ciudad, montaña o carretera?";

      if (step === 1)
        return "Perfecto 👌 ¿Y en qué presupuesto te mueves más o menos?";

      if (step === 2)
        return "Vale. Última cosa: ¿tienes ya experiencia o empiezas ahora?";

      /* Recomendación final, ajustada al uso que indicó el cliente */
      const uso = (answers[1] || '').toLowerCase();
      if (has(uso, 'montañ', 'montan', 'mtb', 'campo', 'monte'))
        return "Te iría muy bien una MTB de doble suspensión, sobre unos 890€. Cuadro de aluminio, 29\", y frenos hidráulicos — que en bajada es lo que de verdad marca la diferencia.\n\n¿Te la reservo para que vengas a probarla?";
      if (has(uso, 'carreter', 'ruta', 'road', 'asfalto'))
        return "Para carretera te recomiendo una de cuadro de aluminio con horquilla de carbono, unos 950€. Grupo Shimano 105, que es el punto donde la relación calidad-precio se dispara.\n\n¿Te la reservo para probarla?";
      return "Con eso, la que mejor te encaja es una híbrida urbana de unos 750€: postura cómoda, cubiertas anchas para el bordillo y soporte para alforjas si algún día llevas peso.\n\n¿Te la reservo para que vengas a probarla?";
    }
  },

  /* ── 3. Cualificación de leads + CRM ────────────────────────── */
  leads: {
    role: "🎭 Tú eres: un lead interesado. Escríbele como si quisieras contratar el servicio.",
    greeting: "¡Hola! Soy el asistente de {{empresa}}. Cuéntame un poco qué necesitas y te ayudo 🙂",
    chips: ["Quiero automatizar el WhatsApp", "Presupuesto de 2.000€", "Para este mes"],
    reply(text, step) {
      if (step === 0)
        return "Entendido 👍 ¿Y qué presupuesto tenéis pensado para esto, aunque sea aproximado?";

      if (step === 1)
        return "Perfecto. ¿Para cuándo lo necesitaríais?";

      /* Cierre + etiqueta que dispara la ficha de CRM */
      return "Genial, ya lo tengo todo ✅ Te he registrado y el equipo te contacta en menos de 24h.\n<<CRM>>";
    }
  }
};

/* ── Motor de la conversación ─────────────────────────────────── */

function empresa(){ return empresaInput.value.trim() || 'tu negocio'; }
function fill(str){ return str.replaceAll('{{empresa}}', empresa()); }

function addBubble(who, text){
  const b = document.createElement('div');
  b.className = 'bubble ' + who;
  b.textContent = text;
  chatBody.appendChild(b);
  chatBody.scrollTop = chatBody.scrollHeight;
}

function addCrmCard(){
  const fields = {
    'nombre':      empresa(),
    'necesidad':   answers[0] || '—',
    'presupuesto': answers[1] || '—',
    'urgencia':    answers[2] || '—',
    'prioridad':   'alta'
  };
  const c = document.createElement('div');
  c.className = 'crm-card';
  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = '✅ AÑADIDO AL CRM';
  c.appendChild(title);
  for (const [k, v] of Object.entries(fields)) {
    const row = document.createElement('div');
    row.className = 'row';
    const key = document.createElement('span'); key.textContent = k;
    const val = document.createElement('span'); val.textContent = v;
    row.append(key, val);
    c.appendChild(row);
  }
  chatBody.appendChild(c);
  chatBody.scrollTop = chatBody.scrollHeight;
}

function renderChips(){
  chipsBox.innerHTML = '';
  SCRIPTS[modoSelect.value].chips.forEach(label => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => { userInput.value = label; sendMessage(); };
    chipsBox.appendChild(b);
  });
}

function resetChat(){
  step = 0;
  answers = [];
  chatBody.innerHTML = '';
  const s = SCRIPTS[modoSelect.value];
  headerName.textContent = empresa();
  avatarLetter.textContent = empresa().charAt(0).toUpperCase();
  roleBanner.textContent = fill(s.role);
  addBubble('bot', fill(s.greeting));
  renderChips();
}

function sendMessage(){
  const text = userInput.value.trim();
  if (!text) return;
  userInput.value = '';
  sendBtn.disabled = true;

  addBubble('lead', text);
  answers.push(text);

  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  chatBody.appendChild(typing);
  chatBody.scrollTop = chatBody.scrollHeight;

  // Pausa variable: un tiempo de respuesta fijo se nota falso enseguida.
  const delay = 700 + Math.random() * 600 + Math.min(text.length * 12, 500);

  setTimeout(() => {
    typing.remove();
    let reply = fill(SCRIPTS[modoSelect.value].reply(text, step));
    step++;

    if (reply.includes('<<CRM>>')) {
      addBubble('bot', reply.replace('<<CRM>>', '').trim());
      setTimeout(addCrmCard, 600);
    } else {
      addBubble('bot', reply);
    }

    sendBtn.disabled = false;
    userInput.focus();
  }, delay);
}

sendBtn.addEventListener('click', sendMessage);
userInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
modoSelect.addEventListener('change', resetChat);
empresaInput.addEventListener('input', () => {
  clearTimeout(window._deb);
  window._deb = setTimeout(resetChat, 500);
});

resetChat();
</script>
</body>
</html>
